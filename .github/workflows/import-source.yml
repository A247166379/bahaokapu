name: Import verified source once

# Temporary, owner-run import of the exact reviewed draft attachment.
# No schedules, push triggers, pull-request triggers, or package execution.
"on":
  workflow_dispatch:

permissions: {}

concurrency:
  group: bahaokapu-initial-source-import
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.repository == 'A247166379/bahaokapu' &&
      github.repository_owner == 'A247166379' &&
      github.actor == 'A247166379' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify the draft archive and commit its source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set -euo pipefail
          command -v gh
          command -v git
          command -v python3
          gh auth setup-git --hostname github.com
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import subprocess
          import tempfile
          import zipfile

          REPOSITORY = "A247166379/bahaokapu"
          OWNER = "A247166379"
          RELEASE_ID = 406080117
          ASSET_NAME = "bahaokapu-v1.0.0.zip"
          EXPECTED_SHA256 = "22b376503889a4661841d720a6008d41652e83a9ea0635bd454874eb8011560d"
          EXPECTED_BYTES = 20_037_076
          EXPECTED_FILES = 3940
          EXPECTED_GITKEEP = 27
          WORKFLOW_PATH = ".github/workflows/import-source.yml"
          DOCUMENTS = {
              "README.md", "LICENSE", ".gitignore", "安装说明.txt",
              "nginx-site.conf.example",
          }

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def git(checkout, *arguments):
              return subprocess.check_output(
                  ["git", "-c", "core.hooksPath=/dev/null", *arguments],
                  cwd=checkout,
              )

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def import_archive(archive, checkout):
              require(archive.stat().st_size == EXPECTED_BYTES, "Archive size mismatch")
              require(sha256(archive) == EXPECTED_SHA256, "Archive SHA-256 mismatch")
              require(not git(checkout, "status", "--porcelain"), "Checkout must be clean")
              tracked = set(git(checkout, "ls-files", "-z").decode("utf-8").split("\0")) - {""}
              require(tracked == DOCUMENTS | {WORKFLOW_PATH}, "Source is already imported or the initial tracked files changed")
              workflow_bytes = (checkout / WORKFLOW_PATH).read_bytes()

              with zipfile.ZipFile(archive) as package:
                  entries = package.infolist()
                  paths = set()
                  file_entries = []
                  for entry in entries:
                      name = entry.filename
                      path = PurePosixPath(name)
                      expected_name = path.as_posix() + ("/" if entry.is_dir() else "")
                      require(name == expected_name and not path.is_absolute(), "Noncanonical or absolute ZIP path")
                      require(path.parts and all(part not in ("", ".", "..") for part in path.parts), "Unsafe ZIP path")
                      require("\\" not in name and ":" not in name and not any(ord(char) < 32 or ord(char) == 127 for char in name), "Unsafe ZIP filename")
                      require(all(part.casefold() not in (".git", ".github") for part in path.parts), "ZIP may not contain Git metadata or workflows")
                      require(name.casefold() not in paths, "Duplicate ZIP path")
                      paths.add(name.casefold())
                      mode = entry.external_attr >> 16
                      require(stat.S_IFMT(mode) in (0, stat.S_IFDIR, stat.S_IFREG), "ZIP contains a symlink or special file")
                      require(not entry.flag_bits & 1, "Encrypted ZIP entries are not allowed")
                      if not entry.is_dir():
                          file_entries.append(entry)
                  require(len(file_entries) == EXPECTED_FILES, "Archive file count mismatch")
                  require(sum(entry.file_size for entry in file_entries) < 100 * 1024 * 1024, "Archive is unexpectedly large")
                  file_names = {entry.filename for entry in file_entries}
                  require(DOCUMENTS <= file_names, "Required repository documents missing")
                  for document in DOCUMENTS:
                      require((checkout / document).read_bytes() == package.read(document), "Repository document differs from reviewed archive: " + document)
                  keep_files = sorted(name for name in file_names if PurePosixPath(name).name == ".gitkeep")
                  require(len(keep_files) == EXPECTED_GITKEEP, "Placeholder count mismatch")

                  # Validate every path first, then extract only regular files into a new temporary directory.
                  with tempfile.TemporaryDirectory(prefix="verified-source-", dir=os.environ["RUNNER_TEMP"]) as temporary:
                      extracted = Path(temporary)
                      for entry in entries:
                          destination = extracted.joinpath(*PurePosixPath(entry.filename).parts)
                          if entry.is_dir():
                              destination.mkdir(parents=True, exist_ok=True)
                              continue
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          with package.open(entry) as source, destination.open("xb") as target:
                              shutil.copyfileobj(source, target)
                          destination.chmod(0o755 if (entry.external_attr >> 16) & 0o111 else 0o644)
                      for name in sorted(file_names):
                          source = extracted.joinpath(*PurePosixPath(name).parts)
                          destination = checkout.joinpath(*PurePosixPath(name).parts)
                          require(not destination.is_symlink(), "Unexpected destination symlink")
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copyfile(source, destination)
                          destination.chmod(stat.S_IMODE(source.stat().st_mode))
                          require(destination.read_bytes() == package.read(name), "Copied file differs from archive")

              require((checkout / WORKFLOW_PATH).read_bytes() == workflow_bytes, "Import workflow changed")
              git(checkout, "add", "--all", "--", ".")
              # Only the 27 verified empty-directory placeholders may bypass .gitignore.
              git(checkout, "add", "--force", "--", *keep_files)
              staged_tracked = set(git(checkout, "ls-files", "-z").decode("utf-8").split("\0")) - {""}
              require(staged_tracked == file_names | {WORKFLOW_PATH}, "Tracked source differs from reviewed archive")
              changed = set(git(checkout, "diff", "--cached", "--name-only", "-z").decode("utf-8").split("\0")) - {""}
              require(changed == file_names - DOCUMENTS, "Unexpected staged changes")
              require(not git(checkout, "diff", "--name-only"), "Unstaged changes after import")
              return len(file_names), len(changed)

          require(os.environ.get("GITHUB_REPOSITORY") == REPOSITORY, "Wrong repository")
          require(os.environ.get("GITHUB_REPOSITORY_OWNER") == OWNER, "Wrong repository owner")
          require(os.environ.get("GITHUB_ACTOR") == OWNER, "Only the owner may run this import")
          require(os.environ.get("GITHUB_REF") == "refs/heads/main", "Import must run on main")
          require(os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch", "Import requires manual dispatch")

          temporary_root = Path(os.environ["RUNNER_TEMP"])
          checkout = temporary_root / "bahaokapu-source-import"
          require(not checkout.exists(), "Import checkout already exists")
          subprocess.run(
              ["git", "-c", "core.hooksPath=/dev/null", "clone", "--single-branch", "--branch", "main",
               "https://github.com/" + REPOSITORY + ".git", str(checkout)],
              check=True,
          )
          initial_head = git(checkout, "rev-parse", "HEAD").decode().strip()
          release = json.loads(subprocess.check_output(["gh", "api", "repos/" + REPOSITORY + "/releases/" + str(RELEASE_ID)]))
          require(release.get("id") == RELEASE_ID and release.get("draft") is True, "Expected release draft missing")
          require(release.get("name") == "八号卡铺 v1.0.0", "Unexpected draft title")
          assets = [asset for asset in release.get("assets", []) if asset.get("name") == ASSET_NAME]
          require(len(assets) == 1, "Expected exactly one named draft asset")
          asset = assets[0]
          require(asset.get("state") == "uploaded" and asset.get("size") == EXPECTED_BYTES, "Draft asset is incomplete or has unexpected size")
          require(asset.get("digest") in (None, "sha256:" + EXPECTED_SHA256), "Draft asset digest mismatch")
          asset_id = asset.get("id")
          require(isinstance(asset_id, int) and asset_id > 0, "Invalid draft asset identifier")
          archive = temporary_root / ASSET_NAME
          with archive.open("xb") as target:
              subprocess.run(
                  ["gh", "api", "-H", "Accept: application/octet-stream",
                   "repos/" + REPOSITORY + "/releases/assets/" + str(asset_id)],
                  stdout=target, check=True,
              )
          files, added = import_archive(archive, checkout)
          git(checkout, "config", "user.name", "github-actions[bot]")
          git(checkout, "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          git(checkout, "commit", "-m", "导入八号卡铺完整源码")
          commit = git(checkout, "rev-parse", "HEAD").decode().strip()
          git(checkout, "fetch", "origin", "main")
          require(git(checkout, "rev-parse", "origin/main").decode().strip() == initial_head, "Main changed during import; refusing to push")
          # Normal fast-forward push only. No release, tag, settings, or history rewrite.
          git(checkout, "push", "origin", "HEAD:refs/heads/main")
          remote_head = git(checkout, "ls-remote", "origin", "refs/heads/main").decode().split()[0]
          require(remote_head == commit, "Remote main does not match the import commit")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as target:
              target.write("Imported verified source: " + str(files) + " files, " + str(added) + " newly tracked files.\n\n")
              target.write("Commit: `" + commit + "`\n\nArchive SHA-256: `" + EXPECTED_SHA256 + "`\n")
          print("Verified source import committed:", commit)
          PY
